---
numberOfDaysToSearch: 7
healthcheck:
  workingText: "WORKING"
mongo:
  host: "mongodb://localhost:27017"
  allow_anonymous: true
  database: "chat"
  messages:
    enabled: true
    limit: 10
    collection: "messages"
logger:
  level: "debug"
extensions:
  prometheus:
    enabled: true
    port: 9090
  # Transitional: statsd is emitted in parallel with Prometheus until the
  # migration is complete. Set enabled: false (or remove) to disable it.
  dogstatsd:
    host: localhost:8125
    prefix: mqtthistory.
    tags_prefix: ""
    rate: 1
    enabled: true
